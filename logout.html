<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Logout | SpendWise</title>

  <link
    rel="stylesheet"
    href="logout.css"
  >

</head>


<body>

  <main class="logout-page">

    <section class="logout-card">

      <!-- LOGO -->

      <div class="brand">

        <span class="brand-icon">
          💰
        </span>

        <span class="brand-name">
          SpendWise
        </span>

      </div>


      <!-- LOGOUT ICON -->

      <div class="logout-icon">
        ↪
      </div>


      <!-- CONTENT -->

      <h1>
        Ready to leave?
      </h1>

      <p class="logout-message">
        Are you sure you want to log out of your SpendWise account?
      </p>


      <!-- ACTIONS -->

      <div class="logout-actions">

        <button
          type="button"
          class="cancel-button"
          id="cancelLogoutBtn"
        >
          Cancel
        </button>


        <button
          type="button"
          class="logout-button"
          id="confirmLogoutBtn"
        >
          Logout
        </button>

      </div>


      <p class="logout-note">
        You can sign in again anytime.
      </p>

    </section>

  </main>


  <script src="logout.js"></script>
  <script src="profile.js"></script>
</body>

</html>
